name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: typecheck, lint, format, test and build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      VERCEL_CLI_VERSION: 65.4.0
      VERCEL_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Bun installs, runs every script and tool, and builds. Only the deployed
      # functions run on Node, on Vercel.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      # The runner has its own Node. A stub that fails goes first on PATH, so a step
      # that would quietly use it fails instead. bunfig.toml's [run] bun and --bun
      # point node at Bun for scripts and the Vercel CLI.
      - name: Keep the runner's Node out of the job
        run: |
          mkdir -p "${RUNNER_TEMP}/no-node"
          printf '#!/bin/sh\necho "node is not used in CI; run it with bun" >&2\nexit 1\n' > "${RUNNER_TEMP}/no-node/node"
          chmod +x "${RUNNER_TEMP}/no-node/node"
          echo "${RUNNER_TEMP}/no-node" >> "${GITHUB_PATH}"
      # Each check runs even if an earlier one failed, so one run reports them all.
      - id: install
        if: ${{ !cancelled() }}
        run: bun install --frozen-lockfile
      - run: bun run typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      - run: bun run lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      - run: bun run format:check
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      - run: bun run test
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      - run: bun run test:db
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      # Installed outside the repository, so it cannot touch the project's
      # dependencies or lockfile, and with no install scripts. Its own package.json
      # stops bun add from using one in a parent folder. The build itself installs
      # from bun.lock, as Vercel does.
      - name: Install the Vercel CLI
        if: ${{ !cancelled() }}
        run: |
          mkdir -p "${RUNNER_TEMP}/vercel-cli"
          echo '{}' > "${RUNNER_TEMP}/vercel-cli/package.json"
          bun add --cwd "${RUNNER_TEMP}/vercel-cli" --ignore-scripts --exact --no-summary "vercel@${VERCEL_CLI_VERSION}"
      # A placeholder lets the build run with no account and no token. Nothing
      # here deploys or contacts a project.
      - name: Add a placeholder project
        run: |
          mkdir -p .vercel
          printf '{"projectId":"prj_placeholder","orgId":"team_placeholder","settings":{"framework":null}}' > .vercel/project.json
      - name: Build
        run: bun run --bun "${RUNNER_TEMP}/vercel-cli/node_modules/.bin/vercel" build --yes
      # Inside the checkout, an import would find a package the tracer missed in the
      # root node_modules, which a deployed function does not have. So load copies from
      # outside it, with any symlink replaced by its file, since imports resolve from
      # where a symlink points. --no-install stops Bun fetching a missing package.
      # Bun prefers a package's "bun" export condition, which Node ignores, so the
      # check refuses one rather than load other files than Node would.
      - name: Check that the built functions load and export only what they should
        run: |
          copy="${RUNNER_TEMP}/built-functions"
          mkdir -p "${copy}"
          cp -RL .vercel/output/functions/api/interactions.func "${copy}/"
          cp -RL .vercel/output/functions/api/cron/reminders.func "${copy}/"
          cd "${copy}"
          if grep -rl --include=package.json '"bun"' interactions.func/node_modules reminders.func/node_modules; then
            echo "A traced package above names Bun, so Bun may load other files than Node" >&2
            exit 1
          fi
          bun --no-install --no-env-file --eval '
            const base = process.cwd();
            const { POST } = await import(`${base}/interactions.func/api/interactions.js`);
            if (typeof POST !== "function") {
              throw new Error("The interactions function does not export POST");
            }
            const cron = await import(`${base}/reminders.func/api/cron/reminders.js`);
            if (typeof cron.GET !== "function" || "POST" in cron) {
              throw new Error("The cron function must export GET and not POST");
            }
          '

  secret-history:
    name: gitleaks full history
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: bash scripts/install-gitleaks.sh
      - name: Refuse a .gitleaksignore file
        run: test ! -e .gitleaksignore
      - name: Scan every commit on every ref
        run: .tools/gitleaks git . --config .gitleaks.toml --redact --ignore-gitleaks-allow --no-banner --log-opts="--all -m --text --no-color"

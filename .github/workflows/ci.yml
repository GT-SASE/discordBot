name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: typecheck, lint, format, test and build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      VERCEL_CLI_VERSION: 65.4.0
      VERCEL_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Bun installs, runs every script and tool, and builds. Only the deployed
      # functions run on Node, on Vercel. The version is packageManager in package.json.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      # Each check runs even if an earlier one failed, so one run reports them all.
      - id: install
        if: ${{ !cancelled() }}
        run: bun install --frozen-lockfile
      - run: bun run typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      - run: bun run lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      - run: bun run format:check
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      - run: bun run test
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      - run: bun run test:db
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      # Installed outside the repository, so it cannot touch the project's
      # dependencies or lockfile, and with no install scripts. Its own package.json
      # stops bun add from using one in a parent folder. The build itself installs
      # from bun.lock, as Vercel does.
      - name: Install the Vercel CLI
        if: ${{ !cancelled() }}
        run: |
          mkdir -p "${RUNNER_TEMP}/vercel-cli"
          echo '{}' > "${RUNNER_TEMP}/vercel-cli/package.json"
          bun add --cwd "${RUNNER_TEMP}/vercel-cli" --ignore-scripts --exact --no-summary "vercel@${VERCEL_CLI_VERSION}"
      # A placeholder lets the build run with no account and no token. Nothing
      # here deploys or contacts a project.
      - name: Add a placeholder project
        run: |
          mkdir -p .vercel
          printf '{"projectId":"prj_placeholder","orgId":"team_placeholder","settings":{"framework":null}}' > .vercel/project.json
      - name: Build
        run: bun --bun "${RUNNER_TEMP}/vercel-cli/node_modules/.bin/vercel" build --yes

  secret-history:
    name: gitleaks full history
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: bash scripts/install-gitleaks.sh
      - name: Refuse a .gitleaksignore file
        run: test ! -e .gitleaksignore
      - name: Scan every commit on every ref
        run: .tools/gitleaks git . --config .gitleaks.toml --redact --ignore-gitleaks-allow --no-banner --log-opts="--all -m --text --no-color"

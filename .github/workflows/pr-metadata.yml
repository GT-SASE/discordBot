name: PR metadata

# Separate from ci.yml so that editing a pull request's title or base re-runs
# these checks without re-running everything else.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: pr-metadata-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  commit-messages:
    name: commit messages
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # The default pull request checkout is a merge commit that never lands on
      # main, so check out the head of the branch and its full history instead.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
      # Event values go through the environment so that a crafted title or
      # branch cannot inject shell commands.
      - name: Check every commit in the pull request
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/check-commit-messages.ts --range "${BASE_SHA}..${HEAD_SHA}"
      - name: Check the pull request title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: node scripts/check-commit-messages.ts --title="${PR_TITLE}"

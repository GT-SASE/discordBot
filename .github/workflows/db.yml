name: Database

# A change to prose alone cannot affect this workflow, so it does not spend Actions
# minutes on one. ci.yml always runs, because it scans and checks those files. A check
# GitHub skips this way never reports, so these lines have to go before these checks
# are made required, as docs/PUBLIC_RELEASE.md says.
on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "README.md"
      - "SECURITY.md"
  push:
    branches: [main, staging]
    paths-ignore:
      - "docs/**"
      - "README.md"
      - "SECURITY.md"

permissions:
  contents: read

jobs:
  migrations:
    name: Migrations and grants
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: npm
      - run: node scripts/check-migration-sql.ts
      - run: npm ci --ignore-scripts
      - run: npm run test:db

  concurrency:
    name: Concurrent writes on Postgres 17
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17@sha256:3b0cda93be7c8dba2ed484d19393d93845dc3dafb88973e248ba8e6d99d784e1
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # The tests fail if this is unset or the server is not Postgres 17.
      CONCURRENCY_DATABASE_URL: postgres://postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:db:concurrency

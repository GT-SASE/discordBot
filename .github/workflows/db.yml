name: Database

# A change to prose alone cannot affect this workflow, so it does not spend Actions
# minutes on one. ci.yml always runs, because it scans and checks those files. A check
# GitHub skips this way never reports, so these lines have to go before these checks
# are made required, as docs/PUBLIC_RELEASE.md says.
on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "README.md"
      - "SECURITY.md"
  push:
    branches: [main, staging]
    paths-ignore:
      - "docs/**"
      - "README.md"
      - "SECURITY.md"

permissions:
  contents: read

jobs:
  migrations:
    name: Migrations and grants
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: npm
      - run: node scripts/check-migration-sql.ts
      - run: npm ci --ignore-scripts
      - run: npm run test:db

  concurrency:
    name: Concurrent writes on Postgres 17
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17@sha256:3b0cda93be7c8dba2ed484d19393d93845dc3dafb88973e248ba8e6d99d784e1
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # The tests fail if this is unset or the server is not Postgres 17.
      CONCURRENCY_DATABASE_URL: postgres://postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:db:concurrency

  postgrest:
    name: Access layer on real PostgREST
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17@sha256:3b0cda93be7c8dba2ed484d19393d93845dc3dafb88973e248ba8e6d99d784e1
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      POSTGREST_DATABASE_URL: postgres://postgres@localhost:5432/postgres
      POSTGREST_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node scripts/prepare-postgrest-db.ts
      - name: Start PostgREST
        run: |
          PGRST_JWT_SECRET="$(openssl rand -hex 32)"
          echo "::add-mask::${PGRST_JWT_SECRET}"
          echo "PGRST_JWT_SECRET=${PGRST_JWT_SECRET}" >> "${GITHUB_ENV}"
          export PGRST_JWT_SECRET
          docker run -d --name postgrest --network host \
            -e PGRST_DB_URI=postgres://authenticator@localhost:5432/postgres \
            -e PGRST_DB_SCHEMAS=public \
            -e PGRST_DB_ANON_ROLE=anon \
            -e PGRST_DB_MAX_ROWS=1000 \
            -e PGRST_JWT_SECRET \
            -e PGRST_ADMIN_SERVER_PORT=3001 \
            postgrest/postgrest:v14.18@sha256:c7cd7e265a85b05248abf53f4473fcec7e327c282d0bd0cf60f1551996d09fcf
      - name: Wait for PostgREST
        run: |
          for _ in $(seq 1 30); do
            if curl --fail --silent http://localhost:3001/ready > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs postgrest
          exit 1
      - run: npm run test:postgrest
      - name: Show PostgREST logs
        if: failure()
        run: docker logs postgrest

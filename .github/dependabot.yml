version: 2

# Commit prefixes keep these updates in the Conventional Commits format.
updates:
  # The bun ecosystem reads package.json and updates bun.lock.
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
    groups:
      dependencies:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # These types follow the Bun version in packageManager, so they move with it
      # by hand.
      - dependency-name: "@types/bun"
      # These types follow the Node.js major version in package.json engines.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # typescript-eslint supports TypeScript below 6.1, so majors wait for it.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # Newer majors add many runtime packages for one function, waitUntil.
      - dependency-name: "@vercel/functions"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
      include: scope
    groups:
      github-actions:
        patterns: ["*"]

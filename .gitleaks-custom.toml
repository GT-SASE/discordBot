# Project rules, scanned without gitleaks' default global allowlist. Do not add
# [extend] here: see the note in .gitleaks.toml.
#
# When adding or changing a rule, check it catches a sample value before merging.

title = "GTSASE Discord Bot custom secret rules"

[[rules]]
id = "age-secret-key"
description = "age encryption identity, classic or post-quantum"
regex = '''AGE-SECRET-KEY-(?:PQ-)?1[0-9A-Z]{20,}'''
keywords = ["age-secret-key-"]

# No leading anchor, so that a prefix such as tok_ cannot hide a token.
[[rules]]
id = "discord-bot-token"
description = "Discord bot token: encoded user ID, timestamp and HMAC"
regex = '''[MNO][A-Za-z0-9_-]{23,30}\.[A-Za-z0-9_-]{6,7}\.[A-Za-z0-9_-]{27,}'''

[[rules]]
id = "discord-webhook-url"
description = "Discord webhook URL, which anyone can post through"
regex = '''https?://(?:[a-z]+\.)?discord(?:app)?\.com/api(?:/v[0-9]+)?/webhooks/[0-9]+/[A-Za-z0-9_-]+'''
keywords = ["webhooks"]

[[rules]]
id = "postgres-connection-password"
description = "Password inside a Postgres connection string"
regex = '''postgres(?:ql)?://[^:@/\s]+:([^@/\s]{4,})@'''
secretGroup = 1
keywords = ["postgres"]

[[rules.allowlists]]
description = "A placeholder in angle brackets, such as <password>, in the docs"
regexes = ['''^<[a-z][a-z-]*>$''']

# A libpq password file line: host:port:database:user:password. The host's
# character set, the numeric or wildcard port and the literal database and user
# keep ordinary colon-separated text and template strings from matching.
[[rules]]
id = "pgpass-line"
description = "Line in the format of a Postgres password file"
regex = '''(?m)^[ \t]*(?:\\[:\\]|[A-Za-z0-9._*/-])+:(?:[0-9]{1,5}|\*):[^\s:$`{}]+:[^\s:$`{}]+:((?:\\.|[^\s:\\]){4,})[ \t]*\r?$'''
secretGroup = 1

[[rules]]
id = "named-secret-env-assignment"
description = "Value assigned to a secret environment variable used by this project"
regex = '''(?i)\b(?:DISCORD_BOT_TOKEN|DATABASE_URL|CRON_SECRET|PGPASSWORD|BOT_APP_PASSWORD|OWNER_PASSWORD)\b["']?[ \t]*[:=][ \t]*["']?([^\s"']{8,})'''
secretGroup = 1

# Reading a variable or calling a function is not a literal secret.
[[rules.allowlists]]
description = "References to the environment, function calls and test assertions"
regexes = [
  '''^\$\{?[A-Za-z_][A-Za-z0-9_]*\}?$''',
  '''^(?:process\.env|import\.meta\.env)(?:\.[A-Za-z_][A-Za-z0-9_]*[!,;)]*|\[)$''',
  '''^[A-Za-z_][A-Za-z0-9_.]*\(.*$''',
  '''^CANARY_[A-Z_]+,?$''',
  # A Postgres URL that names a user and no password: its password comes from elsewhere.
  '''^postgres(?:ql)?://[^:@/\s]+@[^\s"']*$''',
  '''^/g\)\)\.toHaveLength\([0-9]+\);?$''',
]

# An empty value is too short to match. scripts/check-gitleaks-rules.sh checks
# that these pass and that a real-looking password still does not.
[[rules.allowlists]]
description = "Obvious placeholders, which tests and docs use in place of a value"
regexes = [
  '''^(?:placeholder|example)$''',
  '''^<[A-Za-z][A-Za-z0-9_-]*>$''',
  # A Postgres URL whose password is a placeholder in angle brackets.
  '''^postgres(?:ql)?://[^:@/\s]+:<[A-Za-z][A-Za-z0-9_-]*>@[^\s"']*$''',
]

[[rules]]
id = "discord-snowflake"
description = "Number shaped like a Discord ID. Real IDs belong in env vars or the database"
regex = '''\b[1-9][0-9]{16,19}\b'''

[[rules]]
id = "email-address"
description = "Email address, which could be personal"
regex = '''\b[A-Za-z0-9._%+-]+@[A-Za-z0-9-]+(?:\.[A-Za-z0-9-]+)*\.[A-Za-z]{2,}\b'''

[[rules.allowlists]]
description = "No-reply and reserved addresses that cannot identify a person"
regexes = [
  '''(?i)^no-?reply@''',
  '''(?i)^support@github\.com$''',
  '''(?i)@users\.noreply\.github\.com$''',
  '''(?i)@(?:[a-z0-9-]+\.)*example\.[a-z]{2,}$''',
  '''(?i)\.invalid$''',
  '''(?i)\.test$''',
]
